services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: money
      POSTGRES_PASSWORD: money
      POSTGRES_DB: money
    ports:
      - "5432:5432"
    volumes:
      # Runs migrations/*.sql in filename order, but only when the data
      # volume is first created. After a schema change: docker compose down -v
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money -d money"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
